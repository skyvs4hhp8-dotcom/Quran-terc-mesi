<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qur'an Hüzur Arxivim</title>
    
    <!-- iPhone ana ekran ikonu -->
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/quran.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color/96/quran.png">

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(245, 158, 11, 0.15);
            --primary: #f59e0b;
            --primary-glow: rgba(245, 158, 11, 0.2);
            --accent: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 10% 20%, rgba(245, 158, 11, 0.08) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(16, 185, 129, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: auto;
            padding-bottom: 40px;
        }

        .app-header {
            text-align: center;
            margin-bottom: 16px;
            padding: 18px 10px;
            background: linear-gradient(to bottom, rgba(245, 158, 11, 0.06), transparent);
            border-radius: 20px;
        }

        .app-header h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #fde047, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .app-header p {
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 6px;
            font-style: italic;
        }

        .creators-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85), rgba(15, 23, 42, 0.9));
            border: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
        }

        .creators-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--primary);
            margin-bottom: 6px;
        }

        .creators-names {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.3px;
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: #fff;
            font-size: 15px;
            backdrop-filter: blur(10px);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
        }

        .surah-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .surah-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 14px;
            border-radius: 16px;
            color: #fff;
            cursor: pointer;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .surah-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .surah-badge {
            background: rgba(245, 158, 11, 0.15);
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            min-width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .surah-title {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 10px 16px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .batch-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn-batch {
            flex: 1;
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-align: center;
        }

        .btn-copy-all {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .btn-clear-all {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .add-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 18px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: rgba(15, 23, 42, 0.8);
            color: #fff;
            font-size: 14px;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        .backup-panel {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-backup {
            flex: 1;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        .verse-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
            position: relative;
        }

        .verse-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 10px;
        }

        .verse-number {
            background: rgba(245, 158, 11, 0.15);
            color: var(--primary);
            font-size: 13px;
            font-weight: 700;
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .verse-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-copy {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .verse-text {
            font-size: 18px;
            line-height: 1.9;
            color: #f8fafc;
            margin: 0;
            white-space: pre-line;
            letter-spacing: 0.3px;
        }

        .hidden { display: none !important; }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="surah-view">
        <div class="app-header">
            <h1>Hüzur Qatqısı</h1>
            <p>Qəlblərə Fərəh Gətirən Şəxsi Arxiv</p>
        </div>

        <div class="creators-card">
            <div class="creators-title">Layihə Müəllifləri</div>
            <div class="creators-names">Ağa Babayev &bull; Rzazadə Rüfet</div>
        </div>
        
        <div class="backup-panel">
            <button class="btn-backup" onclick="exportData()">💾 Arxivi Qoru (Backup)</button>
            <button class="btn-backup" onclick="triggerImport()">📂 Arxiv yüklə</button>
            <input type="file" id="import-file" class="hidden" accept=".json" onchange="importData(event)">
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="surah-search" class="search-input" placeholder="Surə adı və ya nömrəsi..." onkeyup="filterSurahs()">
        </div>

        <div class="surah-grid" id="surah-container"></div>
    </div>

    <div id="verse-view" class="hidden">
        <button class="back-btn" onclick="showSurahs()">← Surələrə Qayıt</button>

        <div class="app-header" style="text-align: left; margin-bottom: 10px; padding: 10px;">
            <h1 id="current-surah-title" style="font-size: 22px;"></h1>
        </div>

        <!-- Toplu Əməliyyatlar (Hamısını Kopyala və Hamısını Sil) -->
        <div class="batch-actions">
            <button class="btn-batch btn-copy-all" onclick="copyAllVerses()">📋 Hamısını Kopyala</button>
            <button class="btn-batch btn-clear-all" onclick="clearAllVerses()">🗑️ Of ki, hamısını sil</button>
        </div>

        <div class="add-card">
            <div class="input-group">
                <label>Ayələri Səliqə ilə Əlavə Et (Məs: 7. Mətn...)</label>
                <textarea id="verse-text" class="form-control" placeholder="7. Ayənin mətni buraya...&#10;8. Digər ayə..."></textarea>
            </div>
            <button class="btn-primary" onclick="addVerse()">+ Ayəni Əlavə Et</button>
        </div>

        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="verse-search" class="search-input" placeholder="Bu surədə axtar..." onkeyup="filterVerses()">
        </div>

        <div id="verses-container"></div>
    </div>
</div>

<script>
    const surahNames = [
        "Fatihə", "Bəqərə", "Ali-İmran", "Nisa", "Maidə", "Ənam", "Əraf", "Ənfəl", "Tövbə", "Yunus",
        "Hud", "Yusuf", "Rəd", "İbrahim", "Hicr", "Nəhl", "İsra", "Kəhf", "Məryəm", "Taha",
        "Ənbiya", "Həcc", "Möminun", "Nur", "Furqan", "Şüəra", "Nəml", "Qəsəs", "Ənkəbut", "Rum",
        "Loğman", "Səcdə", "Əhzab", "Səba", "Fatir", "Yasin", "Saffat", "Sad", "Zümər", "Qafir",
        "Fussilət", "Şura", "Zuhruf", "Duhan", "Casiyə", "Əhqaf", "Məhəmməd", "Fətih", "Hucurat", "Qaf",
        "Zariyat", "Tur", "Nəcm", "Qəmər", "Rəhman", "Vaqiə", "Hədid", "Mücadilə", "Həşr", "Mütəhinə",
        "Səff", "Cümə", "Münafiqun", "Təğabun", "Talaq", "Təhrim", "Mülk", "Qələm", "Haqqa", "Məaric",
        "Nuh", "Cinn", "Müzzəmmil", "Müddəssir", "Qiyamət", "İnsan", "Mürsəlat", "Nəbə", "Naziat", "Əbəsə",
        "Təkvir", "İnfitar", "Mutaffifin", "İnşiqaq", "Büruc", "Tariq", "Əla", "Ğaşiyə", "Fəcr", "Bələd",
        "Şəms", "Leyl", "Zuha", "İnşirah", "Tin", "Ələq", "Qədr", "Bəyyinə", "Zilzal", "Adiyat",
        "Qariə", "Təkasür", "Əsr", "Huməzə", "Fil", "Qureyş", "Maun", "Kevsər", "Kafirun", "Nəsr",
        "Məsəd", "İxlas", "Fələq", "Nas"
    ];

    let currentSurahIndex = null;
    const surahContainer = document.getElementById('surah-container');

    function renderSurahs(list) {
        surahContainer.innerHTML = '';
        list.forEach((name) => {
            const originalIndex = surahNames.indexOf(name) + 1;
            const card = document.createElement('div');
            card.className = 'surah-card';
            card.onclick = () => openSurah(originalIndex, `${originalIndex}. ${name}`);
            card.innerHTML = `<div class="surah-badge">${originalIndex}</div><div class="surah-title">${name}</div>`;
            surahContainer.appendChild(card);
        });
    }

    renderSurahs(surahNames);

    function filterSurahs() {
        const query = document.getElementById('surah-search').value.toLowerCase();
        const filtered = surahNames.filter((name, idx) => `${idx + 1}. ${name}`.toLowerCase().includes(query));
        renderSurahs(filtered);
    }

    function openSurah(id, name) {
        currentSurahIndex = id;
        document.getElementById('surah-view').classList.add('hidden');
        document.getElementById('verse-view').classList.remove('hidden');
        document.getElementById('current-surah-title').innerText = name;
        document.getElementById('verse-search').value = '';
        window.scrollTo(0, 0);
        loadVerses();
    }

    function showSurahs() {
        document.getElementById('surah-view').classList.remove('hidden');
        document.getElementById('verse-view').classList.add('hidden');
        window.scrollTo(0, 0);
    }

    function getStorageData() {
        return JSON.parse(localStorage.getItem('quran_data') || '{}');
    }

    function exportData() {
        const data = localStorage.getItem('quran_data');
        if (!data || data === '{}') {
            alert('Arxivdə hələ heç nə yoxdur!');
            return;
        }
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'huzur_quran_arxiv.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function triggerImport() {
        document.getElementById('import-file').click();
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const parsed = JSON.parse(e.target.result);
                localStorage.setItem('quran_data', JSON.stringify(parsed));
                alert('Məlumatlar hüzurla bərpa olundu!');
                renderSurahs(surahNames);
            } catch (err) {
                alert('Fayl xətalıdır!');
            }
        };
        reader.readAsText(file);
    }

    function addVerse() {
        const textInput = document.getElementById('verse-text').value.trim();
        if (!textInput) {
            alert('Lütfən mətni yazın!');
            return;
        }

        let data = getStorageData();
        if (!data[currentSurahIndex]) data[currentSurahIndex] = [];

        const lines = textInput.split('\n');
        let addedCount = 0;

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            const match = trimmed.match(/^(\d+)[\.\-\:\)]?\s*(.+)$/);
            if (match) {
                const num = parseInt(match[1]);
                const text = match[2].trim();

                data[currentSurahIndex] = data[currentSurahIndex].filter(v => Number(v.num) !== Number(num));
                data[currentSurahIndex].push({ num: num, text: text });
                addedCount++;
            }
        });

        if (addedCount === 0) {
            alert('Ayə nömrəsi tapılmadı! (Məsələn: 7. Ayənin mətni)');
            return;
        }

        data[currentSurahIndex].sort((a, b) => a.num - b.num);
        localStorage.setItem('quran_data', JSON.stringify(data));

        document.getElementById('verse-text').value = '';
        loadVerses();
        alert(`${addedCount} ayə əlavə olundu!`);
    }

    function loadVerses(filterQuery = '') {
        const container = document.getElementById('verses-container');
        container.innerHTML = '';
        let data = getStorageData();
        let verses = data[currentSurahIndex] || [];

        if (filterQuery) {
            verses = verses.filter(v => v.num.toString().includes(filterQuery) || v.text.toLowerCase().includes(filterQuery.toLowerCase()));
        }

        if (verses.length === 0) {
            container.innerHTML = '<div class="empty-state">Bu surədə hələ ayə yoxdur. Üst paneldən əlavə edə bilərsən ✨</div>';
            return;
        }

        verses.forEach((verse) => {
            const div = document.createElement('div');
            div.className = 'verse-card';
            div.innerHTML = `
                <div class="verse-header">
                    <span class="verse-number">AYƏ ${verse.num}</span>
                    <div class="verse-actions">
                        <button class="action-btn btn-copy" onclick="copyVerse('${verse.num}', \`${verse.text}\`)">📋 Kopyala</button>
                        <button class="action-btn btn-delete" onclick="deleteVerseByNum(${verse.num})">🗑️ Sil</button>
                    </div>
                </div>
                <p class="verse-text">${verse.text}</p>
            `;
            container.appendChild(div);
        });
    }

    function filterVerses() {
        loadVerses(document.getElementById('verse-search').value.trim());
    }

    function copyVerse(num, text) {
        const surahName = surahNames[currentSurahIndex - 1];
        const fullText = `${currentSurahIndex}. ${surahName}, ${num}-ci ayə:\n${text}`;
        navigator.clipboard.writeText(fullText);
        alert('Ayə kopyalandı!');
    }

    function copyAllVerses() {
        let data = getStorageData();
        let verses = data[currentSurahIndex] || [];
        if (verses.length === 0) {
            alert('Kopyalanacaq ayə yoxdur!');
            return;
        }
        const surahName = surahNames[currentSurahIndex - 1];
        let fullText = `${currentSurahIndex}. ${surahName} Surəsi:\n\n`;
        verses.forEach(v => {
            fullText += `${v.num}. ${v.text}\n\n`;
        });
        navigator.clipboard.writeText(fullText);
        alert('Surənin bütün ayələri yaddaşa kopyalandı!');
    }

    function clearAllVerses() {
        if(!confirm('Of ki, bu surənin bütün ayələri silinsin?')) return;
        let data = getStorageData();
        if (data[currentSurahIndex]) {
            delete data[currentSurahIndex];
            localStorage.setItem('quran_data', JSON.stringify(data));
            loadVerses();
            alert('Surə tamamilə təmizləndi!');
        }
    }

    function deleteVerseByNum(verseNum) {
        if(!confirm('Bu ayəni silmək istəyirsən?')) return;
        let data = getStorageData();
        if (data[currentSurahIndex]) {
            data[currentSurahIndex] = data[currentSurahIndex].filter(v => Number(v.num) !== Number(verseNum));
            localStorage.setItem('quran_data', JSON.stringify(data));
            loadVerses(document.getElementById('verse-search').value.trim());
        }
    }
</script>
</body>
</html>
